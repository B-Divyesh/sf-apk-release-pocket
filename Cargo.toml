[package]
name = "apk-release-pocket"
version = "0.1.1"
edition = "2024"
description = "Verify signed Android APKs and build self-hosted release pockets"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-apk-release-pocket"
keywords = ["android", "apk", "release", "signature"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["dist", "site", ".factory"]

[[bin]]
name = "arp"
path = "src/main.rs"

[dependencies]
apk-info = "1.0.12"
apksig = { version = "0.4.0", default-features = false, features = ["signing"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
